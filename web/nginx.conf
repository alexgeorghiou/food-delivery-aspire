server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same routes as the Vite dev proxy: strip /api and forward to the owning service.
    location /api/restaurants {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://restaurants-api:8080;
    }

    location /api/orders {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://orders-api:8080;
    }

    location /api/couriers {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://dispatch-worker:8080;
    }

    # Client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
