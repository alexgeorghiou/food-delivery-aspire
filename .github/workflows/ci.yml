name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FoodDelivery.slnx

      - name: Build
        run: dotnet build FoodDelivery.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test FoodDelivery.slnx --configuration Release --no-build
          --logger "trx;LogFilePrefix=results"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    strategy:
      matrix:
        project: [FoodDelivery.Restaurants.Api, FoodDelivery.Orders.Api, FoodDelivery.Dispatch.Worker]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg PROJECT=${{ matrix.project }} -t food-delivery/${{ matrix.project }}:ci .
